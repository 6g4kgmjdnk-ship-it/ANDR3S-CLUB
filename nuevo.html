<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Andr4sClub</title>
  <style>
    :root {
      --negro: #000;
      --blanco: #fff;
      --amarillo: #ffd91a;
      --rojo: #a31d14;
      --gris: #111;
      --fuente: "Courier New", Courier, monospace;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      background: var(--negro);
      color: var(--amarillo);
      font-family: var(--fuente);
    }

    /* Barra roja de arriba */
    .barra {
      height: 8px;
      background: var(--rojo);
    }

    /* Header: menú, logo, carrito */
    .header {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 16px;
      background: var(--negro);
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 6px;
      width: 36px;
      background: none;
      border: 0;
      cursor: pointer;
    }
    .menu span {
      display: block;
      height: 5px;
      border-radius: 3px;
      background: var(--amarillo);
    }

    .logo {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }
    .logo img {
      display: block;
      width: 190px;
      height: 66px;
      object-fit: cover;
    }

    .carrito {
      background: none;
      border: 0;
      cursor: pointer;
      color: var(--amarillo);
    }
    .carrito svg { width: 38px; height: 38px; display: block; }

    /* Cuadrícula de productos */
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 28px 12px;
      padding: 16px 12px 48px;
    }

    .producto {
      text-align: center;
      text-decoration: none;
      color: inherit;
    }

    .foto {
      position: relative;
      aspect-ratio: 4 / 5;
      background: var(--gris);
      overflow: hidden;
    }
    .tira {
      display: flex;
      height: 100%;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
    }
    .tira::-webkit-scrollbar { display: none; }
    .tira img {
      flex: 0 0 100%;
      width: 100%;
      height: 100%;
      object-fit: contain;
      scroll-snap-align: center;
    }
    .cuenta {
      position: absolute;
      right: 8px;
      bottom: 8px;
      padding: 2px 8px;
      background: rgba(0, 0, 0, 0.75);
      color: var(--amarillo);
      font-size: 12px;
      letter-spacing: 0.08em;
      pointer-events: none;
    }

    .nombre {
      margin-top: 14px;
      font-size: 15px;
      line-height: 1.6;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    .precio {
      margin-top: 4px;
      font-size: 15px;
      letter-spacing: 0.08em;
    }

    .pedir {
      display: block;
      width: 100%;
      margin-top: 12px;
      padding: 12px 8px;
      background: none;
      border: 2px solid var(--amarillo);
      color: var(--amarillo);
      font-family: var(--fuente);
      font-size: 14px;
      letter-spacing: 0.08em;
      text-align: center;
      text-decoration: none;
      text-transform: uppercase;
    }
    .pedir:active { background: var(--amarillo); color: var(--negro); }
    .pedir:focus-visible { outline: 2px solid var(--blanco); outline-offset: 3px; }
    .vacio { grid-column: 1 / -1; text-align: center; padding: 40px 0; }

    .producto:focus-visible,
    .menu:focus-visible,
    .carrito:focus-visible {
      outline: 2px solid var(--blanco);
      outline-offset: 4px;
    }

    @media (min-width: 700px) {
      .grid {
        grid-template-columns: repeat(4, 1fr);
        max-width: 1200px;
        margin: 0 auto;
      }
    }
  </style>
</head>
<body>

  <div class="barra"></div>

  <header class="header">
    <button class="menu" aria-label="Abrir menú">
      <span></span><span></span><span></span>
    </button>

    <a class="logo" href="./">
      <img src="logo.jpeg" alt="Andr4sClub">
    </a>

    <button class="carrito" aria-label="Ver carrito">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M2 3h3l2.4 12.2a2 2 0 0 0 2 1.6h8.2a2 2 0 0 0 2-1.5L21 7H6"/>
        <circle cx="10" cy="20.5" r="1.3" fill="currentColor"/>
        <circle cx="18" cy="20.5" r="1.3" fill="currentColor"/>
      </svg>
    </button>
  </header>

  <main class="grid" id="grid"></main>

  <script>
    // Tu número de WhatsApp: con 57 adelante, sin + ni espacios
    const WHATSAPP = "573116723104";

    const grid = document.getElementById("grid");

    function pesos(n) {
      return "$" + Number(n).toLocaleString("es-CO");
    }

    function tarjeta(p, extras) {
      const mensaje = "Hola Andr4sClub, quiero pedir: " + p.nombre + " (" + pesos(p.precio) + ")";
      const link = "https://wa.me/" + WHATSAPP + "?text=" + encodeURIComponent(mensaje);

      // Primero la foto de products.json y después las de fotos.json
      const fotos = [p.imagen].concat(extras[String(p.id)] || []);

      const caja = document.createElement("article");
      caja.className = "producto";

      const foto = document.createElement("div");
      foto.className = "foto";
      const tira = document.createElement("div");
      tira.className = "tira";
      fotos.forEach(function (nombreFoto) {
        const img = document.createElement("img");
        img.src = encodeURI(nombreFoto);
        img.alt = p.nombre;
        img.loading = "lazy";
        img.onerror = function () { img.remove(); };
        tira.appendChild(img);
      });
      foto.appendChild(tira);

      if (fotos.length > 1) {
        const cuenta = document.createElement("span");
        cuenta.className = "cuenta";
        cuenta.textContent = "1/" + fotos.length;
        tira.addEventListener("scroll", function () {
          const i = Math.round(tira.scrollLeft / tira.clientWidth) + 1;
          cuenta.textContent = i + "/" + tira.children.length;
        });
        foto.appendChild(cuenta);
      }

      const nombre = document.createElement("p");
      nombre.className = "nombre";
      nombre.textContent = p.nombre;

      const precio = document.createElement("p");
      precio.className = "precio";
      precio.textContent = pesos(p.precio);

      const boton = document.createElement("a");
      boton.className = "pedir";
      boton.href = link;
      boton.target = "_blank";
      boton.rel = "noopener";
      boton.textContent = "Pedir por WhatsApp";

      caja.append(foto, nombre, precio, boton);
      return caja;
    }

    Promise.all([
      fetch("products.json").then(function (r) { return r.json(); }),
      fetch("fotos.json").then(function (r) { return r.json(); }).catch(function () { return {}; })
    ])
      .then(function (datos) {
        datos[0].forEach(function (p) { grid.appendChild(tarjeta(p, datos[1])); });
      })
      .catch(function () {
        grid.innerHTML = '<p class="vacio">No se pudieron cargar los productos.</p>';
      });
  </script>

</body>
</html>
