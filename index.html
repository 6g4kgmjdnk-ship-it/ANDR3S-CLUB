
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Andr4sClub — Catálogo</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
  <button class="menu-btn" aria-label="Menú">
    <span></span><span></span><span></span>
  </button>
  <a href="#" class="logo-img"><img src="logo.jpeg" alt="Andr4sClub"></a>
  <div class="cart-icon">🛒</div>
</header>

<section class="grid" id="grid">
  <!-- Las tarjetas de producto se generan aquí con JS -->
</section>

<div class="countdown-bar">
  <div class="countdown" id="countdown">
    <div class="c-block"><span id="c-days">00</span><label>DAYS</label></div>
    <div class="c-block"><span id="c-hours">00</span><label>HOURS</label></div>
    <div class="c-block"><span id="c-mins">00</span><label>MINS</label></div>
    <div class="c-block"><span id="c-secs">00</span><label>SECS</label></div>
  </div>
  <a href="https://wa.me/573116723104" target="_blank" class="cta-btn">PEDIR POR WHATSAPP</a>
</div>

<!-- Modal de producto -->
<div class="modal-fondo" id="modalFondo">
  <div class="modal">
    <div class="modal-img">
      <img id="modalImg" src="" alt="">
    </div>
    <div class="modal-body">
      <button class="cerrar" id="cerrarModal">&times;</button>
      <h2 id="modalNombre"></h2>
      <div class="precio-grande" id="modalPrecio"></div>
      <p class="desc" id="modalDesc"></p>
      <div class="tallas-label">TALLA</div>
      <div class="tallas" id="modalTallas"></div>
      <a href="#" target="_blank" class="pedir-btn" id="modalPedir">PEDIR POR WHATSAPP</a>
    </div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
